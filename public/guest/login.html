<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in - Bright Homes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=DM+Sans:wght@400;500;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="../css/pages/login.css">
</head>

<body>

  <div class="login-wrapper">

    <!-- LEFT: brand / atmosphere panel -->
    <div class="brand-panel">
      <div class="brand-panel-header">
        <span class="brand-mark">Bright Homes .</span>
        <img class="img-sun" src="../assets/logo/bright-homes-logo.svg">
      </div>


      <div class="brand-copy">
        <span class="brand-eyebrow">Welcome back</span>
        <h1 class="brand-headline">Your room is<br>right where<br>you left it.</h1>
        <p class="brand-sub">Sign in with your mobile number to view or manage your stay.</p>
      </div>

      <div class="keycard">
        <span class="keycard-label">Current stay</span>
        <div class="keycard-room">Your bookings</div>
        <div class="keycard-dots"><span></span><span></span><span></span></div>
      </div>
    </div>

    <!-- RIGHT: form panel -->
    <div class="form-panel">
      <div class="form-card">
        <span class="form-status">Guest sign in</span>
        <h2 class="form-title">Log in to your <em>account</em></h2>
        <p class="form-hint">Enter the mobile number you booked with.</p>

        <div class="form-check-error" id="formCheckError" style="display: none;">
        </div>

        <form action="/login" method="POST" id="loginForm">
          <div class="field">
            <label for="mobile-no">Mobile number</label>
            <div class="field-input">
              <span class="field-prefix">+91</span>
              <input type="tel" name="mobile" placeholder="98765 43210" inputmode="numeric" id="mobile-no"
                maxlength="10" required>
            </div>
            <p id="formMobileError" class="form-error" style="display: none;"></p>
          </div>

          <div class="field">
            <label for="password">Password</label>
            <div class="field-input">
              <input type="password" id="password" name="password" placeholder="••••••••" required>
              <img class="toggle-password" src="../assets/icons/icon-show_password.png" id="togglePassword">
            </div>
            <p id="formPasswordError" class="form-error" style="display: none;"></p>
            
          </div>

          <div class="form-row">
            <label class="remember">
              <input type="checkbox" name="remember">
              Keep me signed in
            </label>
            <a href="#" class="forgot-link">Forgot password?</a>
          </div>

          <button type="submit" class="btn-login" >Log in</button>
        </form>

        <p class="signup-note">New here? <a href="../register">Create an account</a></p>
      </div>
    </div>

  </div>

  <script type="module" src="../js/pages/login.js"></script>
</body>

</html>
